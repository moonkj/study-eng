name: todaye
description: "오늘의 영어 — 내 레벨에 맞춘 매일 영어 루틴 (개인용)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 지하철에서도 동작하도록 폰트를 앱에 포함한다 (라이선스: assets/fonts/OFL-*.txt)
  fonts:
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
